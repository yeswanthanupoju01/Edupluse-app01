<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EduPulse AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside>
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i> EduPulse AI
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active"><i class="fa-solid fa-house"></i> Dashboard</a></li>
            <li><a href="students.html"><i class="fa-solid fa-users"></i> Students</a></li>
            <li><a href="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
            <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
        </ul>
        <a href="#" id="logoutLink" class="nav-logout"><i class="fa-solid fa-right-from-bracket"></i> Log out</a>
    </aside>
    <main>
        <header>
            <h1>Early-Warning Dashboard</h1>
            <div class="user-profile">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Admin">
                <div>
                    <h4 id="userName" style="font-size: 0.875rem;">—</h4>
                    <span style="font-size: 0.75rem; color: var(--text-muted);">Faculty Admin</span>
                </div>
            </div>
        </header>
        <div class="stats-grid">
            <div class="stat-card">
                <span>Total Monitored Students</span>
                <h3 id="statTotal">—</h3>
            </div>
            <div class="stat-card">
                <span>At-Risk Students</span>
                <h3 id="statAtRisk" style="color: var(--danger);">—</h3>
            </div>
            <div class="stat-card">
                <span>Average Attendance</span>
                <h3 id="statAvgAttendance">—</h3>
            </div>
        </div>
        <section class="evaluator-section">
            <h2><i class="fa-solid fa-wand-magic-sparkles" style="color: var(--primary);"></i> AI Risk & Recommendation Engine</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Student Name</label>
                    <input type="text" id="studentName" placeholder="e.g. Alex Smith">
                </div>
                <div class="form-group">
                    <label>Attendance (%)</label>
                    <input type="number" id="attendance" min="0" max="100" placeholder="e.g. 75">
                </div>
                <div class="form-group">
                    <label>Exam Marks (%)</label>
                    <input type="number" id="marks" min="0" max="100" placeholder="e.g. 60">
                </div>
                <div class="form-group">
                    <label>Assignments Done (%)</label>
                    <input type="number" id="assignments" min="0" max="100" placeholder="e.g. 50">
                </div>
                <button onclick="evaluateStudent()">Evaluate Risk</button>
            </div>

            <label class="portal-toggle">
                <input type="checkbox" id="createPortalToggle" onchange="document.getElementById('portalFields').style.display = this.checked ? 'grid' : 'none'">
                Also set up portal access so this student can log in and see their own progress
            </label>
            <div class="form-grid" id="portalFields" style="display: none; margin-top: 0.75rem;">
                <div class="form-group">
                    <label>Student Email</label>
                    <input type="email" id="portalEmail" placeholder="student@school.edu">
                </div>
                <div class="form-group">
                    <label>Portal Password</label>
                    <input type="password" id="portalPassword" placeholder="min. 6 characters">
                </div>
            </div>

            <div id="result-card">
                <div id="risk-badge" class="badge">Safe</div>
                <h3 id="res-title" style="margin-bottom: 0.5rem;"></h3>
                <p id="res-recommendation" style="color: var(--text-muted); line-height: 1.5;"></p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
