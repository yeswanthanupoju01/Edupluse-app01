<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - EduPulse AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="logo" style="justify-content: center; margin-bottom: 1.75rem;">
            <i class="fa-solid fa-graduation-cap"></i> EduPulse AI
        </div>
        <p class="auth-subtitle">Log in as faculty or as a student to see your own progress.</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="you@school.edu" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" style="width: 100%; margin-top: 0.5rem;">Log In</button>
        </form>

        <p id="loginError" class="auth-error"></p>

        <p class="auth-hint">
            First time here? A default faculty login was created for you:<br>
            <code>admin@edupulse.local</code> / <code>admin123</code> — change it in Settings after logging in.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
