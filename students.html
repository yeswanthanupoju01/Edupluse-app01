<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Directory - EduPulse AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside>
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i> EduPulse AI
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
            <li><a href="students.html" class="active"><i class="fa-solid fa-users"></i> Students</a></li>
            <li><a href="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
            <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
        </ul>
        <a href="#" id="logoutLink" class="nav-logout"><i class="fa-solid fa-right-from-bracket"></i> Log out</a>
    </aside>
    <main>
        <header>
            <h1>Students Directory</h1>
            <div class="user-profile">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Admin">
                <div>
                    <h4 id="userName" style="font-size: 0.875rem;">—</h4>
                    <span style="font-size: 0.75rem; color: var(--text-muted);">Faculty Admin</span>
                </div>
            </div>
        </header>
        <div class="table-container">
            <div class="table-header">All Monitored Students</div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Attendance</th>
                        <th>Marks</th>
                        <th>Assignments</th>
                        <th>Status</th>
                        <th>Portal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr><td colspan="7" style="color: var(--text-muted); text-align:center; padding: 2rem 0;">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
